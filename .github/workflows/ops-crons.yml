name: ops-crons

# Pings the high-frequency cron endpoints (the hourly renewals job
# lives in renewals-cron.yml):
#
#   /api/follow-ups/cron   — deliver due follow-up reminder notifications
#   /api/automations/cron  — resume automations parked on a Wait step
#   /api/flows/cron        — time out abandoned flow runs
#   /api/whatsapp/webhook  — recover durable WhatsApp webhook receipts
#   /api/v1/broadcasts/cron — recover interrupted public API broadcasts
#   /api/payments/razorpay/recovery/cron — recover webhooks + scan OAuth tokens
#   /api/subscriptions/live-recovery/cron — GET-only SaaS obligation recovery (default off)
#   /api/meta/leads/recovery/cron — recover lead events + repair Page health
#   /api/push/cron — deliver queued mobile push and reconcile Expo receipts
#
# Workers are idempotent and claim-first, so overlapping or doubled
# runs are harmless. Native Vercel Cron on the Hobby plan only allows
# two jobs at daily granularity — so, as with renewals, this GitHub
# Action is the pinger. Uses the same repo secret AUTOMATION_CRON_SECRET.
#
# GitHub schedules are best-effort and can be dropped. Supabase Cron is the
# independent database-owned scheduler; this workflow remains a redundant
# pinger and the alert surface. Use off-boundary minutes to reduce GitHub load
# delays while keeping a separate cadence from the database jobs.

on:
  schedule:
    # The explicit all-hours range preserves the cadence while forcing GitHub
    # to rebuild this schedule after the repository was detached upstream.
    - cron: '11,26,41,56 0-23 * * *'
  # Lets you trigger a run by hand from the Actions tab (for testing).
  workflow_dispatch:

# If a run is somehow still going when the next fires, don't stack them.
concurrency:
  group: ops-crons
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Deliver follow-up reminders
        run: |
          curl --fail --silent --show-error \
            -H "x-cron-secret: ${{ secrets.AUTOMATION_CRON_SECRET }}" \
            https://desk.usefulmade.com/api/follow-ups/cron

      # if: always() — a failure above must not stop the remaining
      # pings; the job still ends red so the failure is visible.
      - name: Resume delayed automations
        if: always()
        run: |
          curl --fail --silent --show-error \
            -H "x-cron-secret: ${{ secrets.AUTOMATION_CRON_SECRET }}" \
            https://desk.usefulmade.com/api/automations/cron

      - name: Sweep abandoned flow runs
        if: always()
        run: |
          curl --fail --silent --show-error \
            -H "x-cron-secret: ${{ secrets.AUTOMATION_CRON_SECRET }}" \
            https://desk.usefulmade.com/api/flows/cron

      - name: Recover WhatsApp webhook receipts
        if: always()
        run: |
          curl --fail --silent --show-error \
            -H "x-cron-secret: ${{ secrets.AUTOMATION_CRON_SECRET }}" \
            https://desk.usefulmade.com/api/whatsapp/webhook

      - name: Recover public API broadcasts
        if: always()
        run: |
          curl --fail --silent --show-error \
            -H "x-cron-secret: ${{ secrets.AUTOMATION_CRON_SECRET }}" \
            https://desk.usefulmade.com/api/v1/broadcasts/cron

      - name: Recover Razorpay events and scan OAuth tokens
        if: always()
        run: |
          curl --fail --silent --show-error \
            -H "x-cron-secret: ${{ secrets.AUTOMATION_CRON_SECRET }}" \
            https://desk.usefulmade.com/api/payments/razorpay/recovery/cron

      - name: Recover original SaaS orders and refunds
        if: always()
        run: |
          curl --fail --silent --show-error --max-time 55 \
            -H "x-cron-secret: ${{ secrets.AUTOMATION_CRON_SECRET }}" \
            https://desk.usefulmade.com/api/subscriptions/live-recovery/cron

      - name: Recover Meta Lead Ads events and Page health
        if: always()
        run: |
          curl --fail --silent --show-error \
            -H "x-cron-secret: ${{ secrets.AUTOMATION_CRON_SECRET }}" \
            https://desk.usefulmade.com/api/meta/leads/recovery/cron

      - name: Deliver mobile push notifications
        if: always()
        run: |
          curl --fail --silent --show-error \
            -H "x-cron-secret: ${{ secrets.AUTOMATION_CRON_SECRET }}" \
            https://desk.usefulmade.com/api/push/cron

      - name: Deliver missed-visit reminders
        if: always()
        run: |
          curl --fail --silent --show-error \
            -H "x-cron-secret: ${{ secrets.AUTOMATION_CRON_SECRET }}" \
            https://desk.usefulmade.com/api/attendance/reminders/cron
