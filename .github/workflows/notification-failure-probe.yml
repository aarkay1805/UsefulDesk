name: Temporary notification failure probe

# Manual-only, no-secret probe used to verify that a failed Actions run reaches
# the repository owner's GitHub notification inbox. Remove after verification.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-for-notification-verification:
    name: Expected failure for notification verification
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Emit the expected probe failure
        run: |
          echo 'Expected failure: verifying the UsefulDesk GitHub Actions alert path.'
          exit 1
