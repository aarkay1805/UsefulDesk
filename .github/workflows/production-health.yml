name: production-health

# A no-secret availability probe for the production login surface. This is
# deliberately independent of Vercel and Supabase so a provider outage still
# produces a failed GitHub Actions run. Critical job and database paths are
# exercised separately by ops-crons.yml and renewals-cron.yml.
on:
  schedule:
    # GitHub recommends off-boundary minutes to reduce delayed/dropped runs.
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: false

jobs:
  login-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify the production login surface
        run: |
          response="$(curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 20 \
            --retry 2 --retry-delay 5 --retry-all-errors \
            https://desk.usefulmade.com/login)"
          grep --fixed-strings --quiet '<title>UsefulDesk' <<<"$response"

  scheduled-workflow-freshness:
    name: Scheduled workflow freshness
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Check scheduled workflow freshness
        run: node scripts/github-workflow-freshness.mjs
