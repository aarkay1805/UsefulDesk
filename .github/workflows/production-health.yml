name: production-health

# A no-secret availability probe for the production login surface. This is
# deliberately independent of Vercel and Supabase so a provider outage still
# produces a failed GitHub Actions run. Critical job and database paths are
# exercised separately by ops-crons.yml and renewals-cron.yml.
on:
  schedule:
    # GitHub recommends off-boundary minutes to reduce delayed/dropped runs.
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:
    inputs:
      reconcile_live_events:
        description: 'Reconcile existing signed Home office SaaS events after owner approval'
        type: boolean
        default: false
        required: false

permissions:
  actions: read
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: false

jobs:
  reconcile-live-events:
    name: Reconcile existing signed SaaS events
    if: github.event_name == 'workflow_dispatch' && inputs.reconcile_live_events
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Reconcile the existing merchant and pilot event queue
        env:
          AUTOMATION_CRON_SECRET: ${{ secrets.AUTOMATION_CRON_SECRET }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          secret = os.environ.get('AUTOMATION_CRON_SECRET', '')
          if len(secret) < 32:
              raise SystemExit('Protected operator credential is unavailable')
          request = urllib.request.Request(
              'https://desk.usefulmade.com/api/subscriptions/live-reconcile',
              data=b'',
              headers={'x-cron-secret': secret},
              method='POST',
          )
          try:
              with urllib.request.urlopen(request, timeout=45) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit(f'Reconciliation returned HTTP {error.code}') from None
          if (not isinstance(result, dict)
              or set(result) != {'inspected', 'reconciled', 'failed'}
              or any(type(value) is not int or value < 0 for value in result.values())):
              raise SystemExit('Unexpected reconciliation response')
          print(json.dumps(result))
          if result['failed']:
              raise SystemExit('Existing event reconciliation needs review')
          PY

  login-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify the production login surface
        run: |
          response="$(curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 20 \
            --retry 2 --retry-delay 5 --retry-all-errors \
            https://desk.usefulmade.com/login)"
          grep --fixed-strings --quiet '<title>UsefulDesk' <<<"$response"

  scheduled-workflow-freshness:
    name: Scheduled workflow freshness
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check scheduled workflow freshness
        run: node scripts/github-workflow-freshness.mjs
