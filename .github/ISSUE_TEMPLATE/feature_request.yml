name: Feature request
description: Propose a new feature or a meaningful enhancement.
title: '[feat] '
labels: ['enhancement', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        UsefulDesk prioritises changes that save the gym owner time,
        recover lost leads, collect renewals, or retain members.
        Before proposing a feature, check the roadmap and explain the
        concrete operator or member problem it solves. See
        [CONTRIBUTING.md](https://github.com/aarkay1805/UsefulDesk/blob/main/CONTRIBUTING.md).

  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
      description: What is the gym owner, staff member, or member trying to do today?
      placeholder: |
        When a broadcast ends I have no way to see which recipients
        didn't reply so I can follow up manually.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Describe the feature from the user's perspective, not the implementation.
      placeholder: |
        On the broadcast detail page, a "No reply" filter that lists
        recipients who received but didn't reply within 24 hours.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Things that kinda work today, workarounds, related features in other tools.
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Your guess — we'll re-scope if needed.
      options:
        - Small (a couple of hours)
        - Medium (a couple of days)
        - Large (a couple of weeks, probably breaks into multiple PRs)
    validations:
      required: false
